[plugin]

name="dot-npc-ai"
description="How an NPC decides. A behaviour tree with real running-state memory, a state machine for the many cases a tree is overkill for, a blackboard, and the steering an NPC needs once there are ninety of them pathing to the same door. The decision half of dot-npc, split off so a game that wants a catalogue and a budget does not install an engine it will not use."
author="dot"
version="0.1.0"
script="dot_npc_ai_plugin.gd"
